# Registre confédéral des citoyens — Cloudflare Worker + D1
# Mise en service : registre/README.md
name = "bk-registre"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "bk-registre"
# Identifiant de la base créée dans le tableau de bord Cloudflare (Workers & Pages > D1).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# Adresse du portail : les liens des e-mails y renvoient (#/confirm/…, #/card/…).
PORTAL_URL = "https://nstevanovic-ids.github.io/BK-Conf/"
# Origines autorisées à appeler l'API (CORS), séparées par des virgules.
ALLOWED_ORIGINS = "https://nstevanovic-ids.github.io"
# Expéditeur vérifié chez Brevo (adresse sur votre domaine, SPF/DKIM configurés).
MAIL_FROM = "registar@example.org"
MAIL_FROM_NAME = "Konfederalni registar državljana"
# Secrets, jamais dans ce fichier (GitHub Actions ou `wrangler secret put`) :
#   BREVO_API_KEY      clé API transactionnelle Brevo
#   TURNSTILE_SECRET   clé secrète du widget Cloudflare Turnstile
#   TOKEN_PEPPER       chaîne aléatoire (32 octets ou plus) qui sale les empreintes de jetons

# Nettoyage quotidien : inscriptions non confirmées, jetons expirés, compteurs anti-abus.
[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true
