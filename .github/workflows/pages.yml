name: Deploy portal to GitHub Pages

on:
  push:
    branches:
      - main   # seule branche publiée (cf. CLAUDE.md, « Branche de référence »)
    paths:
      - "portail/**"
      - "docs/constitution/**"
      - "scripts/build_portail.py"
      - "scripts/build_constitution.py"
      - "scripts/build_lecteur.py"
      - "scripts/equilibre.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow the workflow to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; cancel superseded runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the balance between States and peoples
        run: |
          # Each people's share of the territorial States must stay within 0.85–1.25 of its share of
          # the population (docs/canon/equilibre.md, ADR 2026-11-05-passe-de-fondation.md).
          # A failure blocks the deploy: the answer is an ADR, never a silent redraw of borders.
          python scripts/equilibre.py --check

      - name: Check page translations (three standards)
        run: |
          # textes.json must carry every page string in zap, sre and ist (ADR 2026-10-26-traduction-pages.md);
          # a gap does not block the deploy (the page falls back on English) but is flagged.
          python scripts/textes.py check || echo "::warning::page translations incomplete — run python scripts/textes.py check"

      - name: Check that the Constitution data are up to date
        run: |
          # constitution*.json and the reader data (portail/data/constitution/) are generated from the
          # five texts of docs/constitution/ (scripts/build_constitution.py, then build_lecteur.py, which
          # fails on a misaligned text, diverging cross-references or a missing instrument anchor).
          # A text changed without regenerating them blocks the deploy.
          python scripts/build_constitution.py
          git add -N portail/data
          git diff --exit-code --stat -- portail/data/constitution.json portail/data/constitution.*.json portail/data/constitution/ \
            || { echo "::error::generated Constitution data are stale — run python scripts/build_constitution.py"; exit 1; }

      - name: Build linked portal and single-file export
        run: |
          # Linked build (ADR 2026-11-23-deploiement-lie.md): the template, the data on the whitelist of
          # scripts/build_portail.py (never the source GeoJSON), fonts, libraries, images and films as
          # files; the self-contained single file is published as an export in export/index.html.
          python scripts/build_portail.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
