name: Deploy portal to GitHub Pages

on:
  push:
    branches:
      - main   # seule branche publiée (cf. CLAUDE.md, « Branche de référence »)
    paths:
      - "portail/**"
      - "scripts/build_portail.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow the workflow to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; cancel superseded runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build self-contained portal
        run: |
          python scripts/build_portail.py --inline
          mkdir -p _site
          cp balkanska_konfederacija.html _site/index.html
          # Ship the licensed Zurich font files if present (referenced by @font-face)
          if [ -d portail/fonts ]; then cp -r portail/fonts _site/fonts; fi
          # Ship owner-supplied images (referenced as images/<id>.jpg)
          if [ -d portail/images ]; then cp -r portail/images _site/images; fi
          # Ship state films (referenced as videos/<code>.mp4, see scripts/encode_video.py)
          if [ -d portail/videos ]; then cp -r portail/videos _site/videos; fi
          cp portail/favicon.ico portail/apple-touch-icon.png _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
