function L(rel,href,as){var l=document.createElement('link');l.rel=rel;l.href=href;if(as){l.as=as;l.setAttribute('fetchpriority','high');}document.head.appendChild(l);}

else if(/art|title|constitution/i.test(h))L('modulepreload','reader.js');})();</script>
